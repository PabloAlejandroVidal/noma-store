<header class="header">
  <a class="wordmark" routerLink="/" aria-label="NOMA home">NOMA</a>
  <nav aria-label="Primary navigation">
    <a routerLink="/collection" routerLinkActive="is-active">Collection</a>
    <a routerLink="/about" routerLinkActive="is-active">About</a>
  </nav>
  <button class="cart-button" type="button" (click)="cart.open()" aria-label="Open shopping cart">
    Cart <span aria-live="polite">({{ cart.itemCount() }})</span>
  </button>
</header>
